<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}netwatch{% endblock %}</title>
{% block refresh %}<meta http-equiv="refresh" content="20">{% endblock %}
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --ink: #18212b; --muted: #5d6b7a; --line: #d9dfe6;
    --high: #b42318; --medium: #a15c07; --low: #476582; --ok: #0f6b5c; --link: #1d4f91;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --panel: #1c2229; --ink: #e6ebf0; --muted: #98a5b3; --line: #2c353f;
            --high: #ff8a7d; --medium: #f0b45a; --low: #8db2d6; --ok: #5fcdb8; --link: #8fb8f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--link); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0 auto 0 0; }
  header h1 a { color: inherit; text-decoration: none; }
  .pill { padding: 3px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
  .pill.live { color: var(--ok); border-color: var(--ok); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  h2 form { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .muted { color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .dot.high { background: var(--high); } .dot.medium { background: var(--medium); } .dot.low { background: var(--low); }
  .acked { opacity: .5; }
  button { font: inherit; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--line);
           background: transparent; color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  input[type=text] { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px;
                     background: var(--bg); color: var(--ink); }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 72px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: 12px; color: var(--muted); }
  .bar i { display: block; width: 100%; background: var(--high); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--high); color: var(--high); }
  .empty { color: var(--muted); padding: 8px 0; }
</style>
</head>
<body><main>
<header>
  <h1><a href="{{ url_for('index') }}">netwatch</a></h1>
  {% block status %}{% endblock %}
</header>
{% block body %}{% endblock %}
</main></body></html>
